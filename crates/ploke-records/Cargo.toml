[package]
name = "ploke-records"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ploke-protocol = { workspace = true, optional = true }

[features]
default = []
protocol = ["dep:ploke-protocol"]

[dev-dependencies]
serde_json.workspace = true
serde_path_to_error = "0.1"
