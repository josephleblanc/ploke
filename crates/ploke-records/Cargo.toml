[package]
name = "ploke-records"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
uuid = { workspace = true, features = ["serde"] }
sha2 = "0.10"
flate2 = "1.0"
ploke-llm = { path = "../ploke-llm", default-features = false, optional = true }
ploke-protocol = { path = "../ploke-protocol", default-features = false, features = ["record-types"], optional = true }
ploke-tui = { path = "../ploke-tui", default-features = false, features = ["tool_contracts"], optional = true }

[features]
default = []
llm-response = ["dep:ploke-llm"]
protocol = ["dep:ploke-protocol"]
tool-contracts = ["dep:ploke-tui"]

[dev-dependencies]
serde_json.workspace = true
serde_path_to_error = "0.1"
toml.workspace = true
