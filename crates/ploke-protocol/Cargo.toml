[package]
name = "ploke-protocol"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Internal non-release-facing protocol framework and procedure experiments for ploke"

[dependencies]
async-trait = "0.1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
ploke-llm = { path = "../ploke-llm", optional = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], optional = true }
fxhash = { workspace = true }
tokio = { workspace = true, optional = true }

[features]
default = ["llm"]
llm = ["dep:ploke-llm", "dep:reqwest", "dep:tokio"]
record-types = []
