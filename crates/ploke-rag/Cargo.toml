[package]
name = "ploke-rag"
version = "0.1.0"
edition = "2024"

[dependencies]
ploke-db = { path = "../ploke-db" }
ploke-embed = { path = "../ingest/ploke-embed" }
ploke-error = { path = "../ploke-error" }
ploke-core = { path = "../ploke-core" }
ploke-io = { path = "../ploke-io" }
serde = { workspace = true }

itertools = { workspace = true }

thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
ploke-test-utils = { path = "../test-utils" }
cozo = { workspace = true }
lazy_static = "1.5.0"
criterion = { version = "0.7", features = ["async_tokio"] }

[features]
default = []
# CALL_GRAPH_GATE:db-projection - historical feature name; currently gates DB projection
# consumers while backup fixtures are reviewed/regenerated.
call_graph = ["ploke-db/call_graph"]
