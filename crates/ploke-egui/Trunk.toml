# Operator graph UI (ploke-egui). Build from repo root:
#   trunk build --config crates/ploke-egui/Trunk.toml
#   trunk serve --config crates/ploke-egui/Trunk.toml
#
# Root Trunk.toml still targets ploke-tree-egui (playback browser demo).

[build]
target = "index.html"
dist = "dist"

[watch]
ignore = ["dist"]
