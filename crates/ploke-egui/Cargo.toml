[package]
name = "ploke-egui"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "egui run playback browser for Ploke"

[dependencies]
ploke-protocol = { workspace = true }
ploke-records = { workspace = true }
ploke-tree = { workspace = true }
ploke-egui-macros = { workspace = true }
eframe = { version = "0.34", features = ["persistence"] }
egui = "0.34"
egui_extras = { version = "0.34", features = ["syntect"] }
egui_graphs = "0.30"
itoa = "1"
chrono = { workspace = true }
petgraph = { version = "0.8", default-features = false, features = ["stable_graph"] }
profiling = { version = "=1.0.17", default-features = false }
puffin = { version = "=0.19.1", default-features = false, features = ["serialization"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
similar = "2"
tracing = { workspace = true }
tracking-allocator = { version = "0.4", features = ["tracing-compat"], optional = true }
backtrace = { version = "0.3", optional = true }
tracing-subscriber = { workspace = true, optional = true }
egui_tiles = "0.15"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
js-sys = "0.3.98"
wasm-bindgen-futures = "0.4.71"
wasm-bindgen = "0.2.121"
web-sys = { version = "0.3.98", features = [
    "Blob",
    "console",
    "Document",
    "Element",
    "Event",
    "File",
    "FileList",
    "FileReader",
    "Headers",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Window",
] }

[features]
default = []
dev = ["dep:clap"]
native-benchmark = [
    "profile-with-puffin",
    "dep:tracking-allocator",
    "dep:backtrace",
    "dep:tracing-subscriber",
]
profile-with-puffin = ["profiling/profile-with-puffin", "dep:puffin"]
