[package]
name = "ploke-egui"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "egui run playback browser for Ploke"

[dependencies]
ploke-records = { workspace = true }
ploke-tree = { workspace = true }
eframe = "0.34"
egui = "0.34"
egui_extras = { version = "0.34", features = ["syntect"] }
egui_graphs = "0.30"
itoa = "1"
petgraph = { version = "0.8", default-features = false, features = ["stable_graph"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
similar = "2"
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
wasm-bindgen-futures = "0.4.71"
wasm-bindgen = "0.2.121"
web-sys = { version = "0.3.98", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
] }

[features]
default = []
dev = ["dep:clap"]

[dev-dependencies]
tracing-subscriber = { workspace = true }
